<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="lumaAIBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3c2819"/>
      <stop offset="65%" stop-color="#22150b"/>
      <stop offset="100%" stop-color="#150c06"/>
    </radialGradient>

    <!-- Warm Glow Filter -->
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="goldCrema" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e5c9"/>
      <stop offset="35%" stop-color="#dfaa6b"/>
      <stop offset="100%" stop-color="#b47b48"/>
    </linearGradient>

    <linearGradient id="softOliveAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ba888"/>
      <stop offset="100%" stop-color="#4a5d4a"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Container -->
  <circle cx="256" cy="256" r="236" fill="url(#lumaAIBg)" stroke="#b47b48" stroke-width="3"/>
  <circle cx="256" cy="256" r="222" stroke="#c89658" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.45"/>

  <!-- Ambient Glow Core -->
  <circle cx="256" cy="230" r="90" fill="#b47b48" opacity="0.15" filter="url(#aiGlow)"/>

  <!-- Intertwined AI Sparkle & Coffee Bean Geometry -->
  <!-- Outer Coffee Cup / Sanctuary Arch Silhouette -->
  <path d="M 170 190 C 170 300 210 325 256 325 C 302 325 342 300 342 190" fill="none" stroke="url(#goldCrema)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Saucer / Foundation Base Curve -->
  <path d="M 188 348 C 220 358 292 358 324 348" stroke="#b47b48" stroke-width="3" stroke-linecap="round"/>

  <!-- Rising Intelligent Steam Curves / Synapse Waves -->
  <path d="M 215 200 C 205 160 230 135 220 100" fill="none" stroke="url(#goldCrema)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 297 200 C 307 160 282 135 292 100" fill="none" stroke="url(#goldCrema)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Central Luma 4-Point Star (Primary AI Intelligence Spark) -->
  <g transform="translate(256, 175)">
    <!-- Main Luminous Diamond Sparkle -->
    <path d="M 0 -58 Q 0 0 58 0 Q 0 0 0 58 Q 0 0 -58 0 Q 0 0 0 -58 Z" fill="url(#goldCrema)" filter="url(#aiGlow)"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
  </g>

  <!-- Secondary Satellite Synapse Nodes (AI recommendations / flavor pairing nodes) -->
  <circle cx="220" cy="98" r="5" fill="#f5e5c9"/>
  <circle cx="292" cy="98" r="5" fill="#f5e5c9"/>

  <!-- Minor Sparkles -->
  <path d="M 335 155 Q 335 167 347 167 Q 335 167 335 179 Q 335 167 323 167 Q 335 167 335 155 Z" fill="#dfaa6b"/>
  <path d="M 175 165 Q 175 174 184 174 Q 175 174 175 183 Q 175 174 166 174 Q 175 174 175 165 Z" fill="#dfaa6b" opacity="0.85"/>

  <!-- Subtle Status Indicator (Live Concierge) -->
  <circle cx="256" cy="385" r="4.5" fill="#52b788"/>

  <!-- "LUMA AI" Clean Sub-label at bottom -->
  <text x="256" y="420" text-anchor="middle" font-family="'Inter', 'Plus Jakarta Sans', sans-serif" font-size="21" font-weight="700" letter-spacing="9" fill="#f5e5c9">LUMA AI</text>
  <text x="256" y="444" text-anchor="middle" font-family="'Inter', 'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" letter-spacing="4" fill="#a48873">CONCIERGE</text>
</svg>
